name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview requests pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "DeepSeekBalance" --add-data "index.html;." --icon "icon.ico" "check_balance.pyw"

      - name: Copy config
        run: Copy-Item "config.json" -Destination "dist\config.json"

      - name: Zip release
        run: Compress-Archive -Path "dist\*" -DestinationPath "DeepSeekBalance-${{ github.ref_name }}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DeepSeekBalance-${{ github.ref_name }}.zip
          generate_release_notes: true
